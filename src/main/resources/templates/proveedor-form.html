
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esencia & Aroma | Nuevo proveedor</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app-body">

<header class="encabezado">
    <div class="logo">Esencia <span>&amp; Aroma</span></div>
    <div class="accesos">Administración</div>
</header>

<div class="panel-principal">

    <aside class="menu-lateral">
        <p class="menu-titulo">MENÚ PRINCIPAL</p>
        <nav class="menu-enlaces">
            <a th:href="@{/panel}">Inicio</a>
            <a th:href="@{/inventario}">Inventario</a>
            <a th:href="@{/abastecimiento}" class="activo">Abastecimiento</a>
            <a th:href="@{/ventas}">Clientes y Ventas</a>
            <a th:href="@{/cobranzas}">Cobranzas y Reportes</a>
        </nav>
        <div class="menu-inferior">
            <form th:action="@{/logout}" method="post" class="form-cerrar-sesion">
                <button type="submit" class="btn-cerrar-sesion">Cerrar sesión</button>
            </form>
            <p>Esencia &amp; Aroma</p>
            <span>Sistema de gestión comercial</span>
        </div>
    </aside>

    <main class="contenido">

        <section class="bienvenida">
            <a th:href="@{/abastecimiento/proveedores}" class="volver-panel">
                ← Volver a proveedores
            </a>
            <h1>Registrar proveedor</h1>
            <p>Completa los datos del proveedor.</p>
        </section>

        <section class="seccion-modulos">

            <form class="formulario-producto"
                  th:action="@{/abastecimiento/proveedores/nuevo}"
                  th:object="${formulario}"
                  method="post">

                <div class="alerta-error"
                     th:if="${#fields.hasAnyErrors()}">
                    <p th:each="e : ${#fields.allErrors()}"
                       th:text="${e.defaultMessage}"></p>
                </div>

                <div class="grid-formulario">

                    <div class="campo-formulario">
                        <label for="nombre">Nombre del proveedor *</label>
                        <input id="nombre" type="text"
                               th:field="*{nombre}" required>
                        <small class="mensaje-error"
                               th:errors="*{nombre}"></small>
                    </div>

                    <div class="campo-formulario">
                        <label for="telefono">Teléfono *</label>
                        <input id="telefono" type="text"
                               th:field="*{telefono}" required>
                        <small class="mensaje-error"
                               th:errors="*{telefono}"></small>
                    </div>

                    <div class="campo-formulario">
                        <label for="correo">Correo electrónico *</label>
                        <input id="correo" type="email"
                               th:field="*{correo}" required>
                        <small class="mensaje-error"
                               th:errors="*{correo}"></small>
                    </div>

                    <div class="campo-formulario">
                        <label for="direccion">Dirección</label>
                        <input id="direccion" type="text"
                               th:field="*{direccion}">
                    </div>

                    <div class="campo-formulario">
                        <label for="tipoProveedor">Tipo de proveedor *</label>
                        <select id="tipoProveedor"
                                th:field="*{tipoProveedor}" required>
                            <option value="">Seleccionar tipo</option>
                            <option th:each="tipo : ${tiposProveedor}"
                                    th:value="${tipo.name()}"
                                    th:text="${tipo}">
                            </option>
                        </select>
                        <small class="mensaje-error"
                               th:errors="*{tipoProveedor}"></small>
                    </div>

                </div>

                <div class="acciones-formulario">
                    <a th:href="@{/abastecimiento/proveedores}"
                       class="btn-secundario">Cancelar</a>

                    <button type="submit" class="btn-primario">
                        Guardar proveedor
                    </button>
                </div>

            </form>

        </section>
    </main>
</div>

<footer class="app-footer">Esencia &amp; Aroma © 2026</footer>
</body>
</html>
