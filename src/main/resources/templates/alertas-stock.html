
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alertas de stock | Esencia & Aroma</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

    <style>
        .alertas-contenedor {
            max-width: 1100px;
            margin: 35px auto;
            padding: 25px;
            font-family: Arial, sans-serif;
        }

        .alertas-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .alertas-cabecera h1 {
            color: #b83271;
            margin: 0 0 8px;
        }

        .alertas-cabecera p {
            color: #666;
            margin: 0;
        }

        .alertas-volver {
            padding: 11px 18px;
            border-radius: 9px;
            background: #b83271;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .alertas-tabla-contenedor {
            background: white;
            border: 1px solid #f0d8e3;
            border-radius: 14px;
            overflow-x: auto;
        }

        .alertas-tabla {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }

        .alertas-tabla th {
            background: #fce8f1;
            color: #823153;
            padding: 16px;
            text-align: left;
        }

        .alertas-tabla td {
            padding: 15px 16px;
            border-bottom: 1px solid #f2e6ec;
        }

        .alertas-tabla tr:last-child td {
            border-bottom: none;
        }

        .alertas-etiqueta {
            background: #fff0d9;
            color: #975d00;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .alertas-vacio {
            padding: 45px 20px;
            text-align: center;
            color: #666;
        }

        .alertas-vacio h3 {
            color: #b83271;
        }
    </style>
</head>

<body>

<main class="alertas-contenedor">

    <div class="alertas-cabecera">

        <div>
            <h1>Alertas de stock</h1>
            <p>
                Historial de productos que alcanzaron
                su stock mínimo.
            </p>
        </div>

        <a th:href="@{/inventario}"
           class="alertas-volver">
            Volver a Inventario
        </a>

    </div>

    <div th:if="${#lists.isEmpty(alertas)}"
         class="alertas-vacio">

        <h3>No hay alertas registradas</h3>

        <p>
            Cuando un producto alcance su stock mínimo,
            aparecerá una notificación en esta sección.
        </p>

    </div>

    <div th:unless="${#lists.isEmpty(alertas)}"
         class="alertas-tabla-contenedor">

        <table class="alertas-tabla">

            <thead>
            <tr>
                <th>Fecha</th>
                <th>Código</th>
                <th>Producto</th>
                <th>Stock anterior</th>
                <th>Stock actual</th>
                <th>Stock mínimo</th>
                <th>Estado</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="alerta : ${alertas}">

                <td th:text="${alerta.fechaFormateada}">
                </td>

                <td th:text="${alerta.codigoProducto}">
                </td>

                <td th:text="${alerta.nombreProducto}">
                </td>

                <td th:text="${alerta.stockAnterior}">
                </td>

                <td th:text="${alerta.stockActual}">
                </td>

                <td th:text="${alerta.stockMinimo}">
                </td>

                <td>
                    <span class="alertas-etiqueta">
                        Stock bajo
                    </span>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
